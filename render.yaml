services:
  - type: web
    name: karan-portfolio-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python rag_service.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
