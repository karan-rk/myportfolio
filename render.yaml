services:
  - type: web
    name: karan-portfolio-ai
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python rag_service.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CORS_ORIGINS
        value: https://karan-rk.github.io
  - type: web
    name: karan-speech-emotion-api
    plan: free
    runtime: python
    rootDir: projects/speech-emotion-detection/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://karan-rk.github.io
      - key: OMP_NUM_THREADS
        value: 1
      - key: TF_NUM_INTEROP_THREADS
        value: 1
      - key: TF_NUM_INTRAOP_THREADS
        value: 1
      - key: MALLOC_ARENA_MAX
        value: 2
